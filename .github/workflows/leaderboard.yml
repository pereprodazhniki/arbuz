name: Leaderboard sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync leaderboard
        run: node scripts/leaderboard.js

      - name: Commit changes
        run: |
          if git diff --quiet -- leaderboard.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leaderboard.json
          git commit -m "leaderboard: sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
